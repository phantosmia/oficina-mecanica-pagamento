name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # Histórico completo: o SonarCloud usa o blame para separar o código novo.
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restaurar cache do ambiente virtual
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.12-poetry-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependências
        run: poetry install --with dev

      - name: Executar testes com cobertura (mínimo 80%)
        # PostgreSQL via Testcontainers, SQS/SNS pelo moto e Mercado Pago por um fake: o CI nunca chama o provedor.
        run: poetry run pytest

      - name: Análise do SonarCloud
        # Configuração em sonar-project.properties; usa o coverage.xml do passo anterior.
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t oficina-mecanica-pagamento:ci .

  kubernetes:
    name: Validar manifests Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Renderizar overlay aws-academy
        run: kubectl kustomize k8s/overlays/aws-academy > /dev/null

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formatação
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validar configuração
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
