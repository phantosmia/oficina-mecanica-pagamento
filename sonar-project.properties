# Análise de qualidade e cobertura no SonarCloud (passo "Análise do SonarCloud" do CI).
sonar.host.url=https://sonarcloud.io
sonar.organization=phantosmia
sonar.projectKey=phantosmia_oficina-mecanica-pagamento
sonar.projectName=oficina-mecanica-pagamento

sonar.sources=app,scripts
sonar.tests=tests
sonar.python.version=3.12
# Gerado pelo pytest (addopts do pyproject.toml) no passo de testes.
sonar.python.coverage.reportPaths=coverage.xml

# O passo do CI espera o resultado e falha se o Quality Gate falhar.
sonar.qualitygate.wait=true
